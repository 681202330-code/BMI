<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Pro Analytics Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a', /* Deep Navy/Black Background */
                        panelBg: '#1e293b', /* Panel Background */
                        panelBorder: '#334155',
                        neonGreen: '#10b981', /* Primary Accent */
                        neonGreenHover: '#059669',
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Custom Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 24px; /* Touchable area */
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Track */
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #334155;
            border-radius: 9999px;
        }

        /* Thumb */
        input[type=range]::-webkit-slider-thumb {
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981; /* Neon Green */
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -7px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
            border: 2px solid #fff;
            transition: transform 0.1s;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* Gender Button Active State (Neon Green Border & Text) */
        .gender-btn.active {
            border-color: #10b981;
            color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }

        .gender-btn.inactive {
            border-color: #334155;
            color: #94a3b8;
            background-color: transparent;
        }

        /* Segmented Bar CSS */
        .bmi-segment {
            height: 100%;
        }
        
        .indicator-line {
            transition: left 0.3s ease-out;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col font-sans">

    <header class="max-w-7xl mx-auto w-full mb-8 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-neonGreen flex items-center justify-center shadow-[0_0_15px_rgba(16,185,129,0.4)]">
            <i class="fa-solid fa-heart-pulse text-white text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-wide">Health Pro <span class="text-neonGreen font-medium text-sm border border-neonGreen rounded-full px-3 py-1 ml-2">Analytics</span></h1>
    </header>

    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
        
        <!-- Left Panel: Inputs (lg:col-span-5) -->
        <section class="lg:col-span-5 bg-panelBg rounded-2xl border border-panelBorder p-6 flex flex-col gap-6 shadow-xl">
            <div class="flex items-center gap-2 border-b border-panelBorder pb-4">
                <i class="fa-solid fa-sliders text-neonGreen"></i>
                <h2 class="text-lg font-semibold">ข้อมูลส่วนบุคคล</h2>
            </div>

            <!-- Name Input -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">ชื่อ - นามสกุล หรือ ชื่อเล่น</label>
                <input type="text" id="userName" placeholder="เช่น คุณสมชาย สุขภาพดี" 
                    class="w-full bg-darkBg border border-panelBorder rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-neonGreen transition-colors">
            </div>

            <!-- Gender Selection -->
            <div>
                <label class="block text-sm text-slate-400 mb-2">เพศ (Gender)</label>
                <div class="grid grid-cols-2 gap-4">
                    <button id="btnMale" onclick="setGender('male')" class="gender-btn active flex items-center justify-center gap-2 py-3 rounded-lg border-2 transition-all">
                        <i class="fa-solid fa-mars text-lg"></i>
                        <span class="font-medium">ชาย</span>
                    </button>
                    <button id="btnFemale" onclick="setGender('female')" class="gender-btn inactive flex items-center justify-center gap-2 py-3 rounded-lg border-2 transition-all">
                        <i class="fa-solid fa-venus text-lg"></i>
                        <span class="font-medium">หญิง</span>
                    </button>
                </div>
            </div>

            <!-- Sliders Grid -->
            <div class="grid grid-cols-2 gap-4 mt-2">
                <!-- Age -->
                <div class="bg-darkBg border border-panelBorder rounded-lg p-4">
                    <div class="flex justify-between items-end mb-4">
                        <label class="text-sm text-slate-400">อายุ (Age)</label>
                        <div class="text-neonGreen font-bold text-xl"><span id="valAge">25</span> <span class="text-xs text-slate-400 font-normal">ปี</span></div>
                    </div>
                    <input type="range" id="inputAge" min="15" max="100" value="25" oninput="updateCalculations()">
                </div>

                <!-- Height -->
                <div class="bg-darkBg border border-panelBorder rounded-lg p-4">
                    <div class="flex justify-between items-end mb-4">
                        <label class="text-sm text-slate-400">ส่วนสูง (Height)</label>
                        <div class="text-neonGreen font-bold text-xl"><span id="valHeight">170</span> <span class="text-xs text-slate-400 font-normal">ซม.</span></div>
                    </div>
                    <input type="range" id="inputHeight" min="120" max="220" value="170" oninput="updateCalculations()">
                </div>

                <!-- Weight -->
                <div class="bg-darkBg border border-panelBorder rounded-lg p-4">
                    <div class="flex justify-between items-end mb-4">
                        <label class="text-sm text-slate-400">น้ำหนัก (Weight)</label>
                        <div class="text-neonGreen font-bold text-xl"><span id="valWeight">65</span> <span class="text-xs text-slate-400 font-normal">กก.</span></div>
                    </div>
                    <input type="range" id="inputWeight" min="30" max="150" value="65" oninput="updateCalculations()">
                </div>

                <!-- Waist -->
                <div class="bg-darkBg border border-panelBorder rounded-lg p-4">
                    <div class="flex justify-between items-end mb-4">
                        <label class="text-sm text-slate-400">รอบเอว (Waist)</label>
                        <div class="text-neonGreen font-bold text-xl"><span id="valWaist">75</span> <span class="text-xs text-slate-400 font-normal">ซม.</span></div>
                    </div>
                    <input type="range" id="inputWaist" min="40" max="150" value="75" oninput="updateCalculations()">
                </div>
            </div>
        </section>

        <!-- Right Panel: Results (lg:col-span-7) -->
        <section class="lg:col-span-7 bg-panelBg rounded-2xl border border-panelBorder p-6 flex flex-col gap-6 shadow-xl relative z-10">
            <!-- Header & Action Buttons -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-panelBorder pb-4">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-neonGreen animate-pulse"></div>
                    <h2 class="text-lg font-semibold">รายงานผลวิเคราะห์สุขภาพ</h2>
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <button class="flex-1 sm:flex-none bg-darkBg border border-panelBorder hover:border-neonGreen text-white px-4 py-2 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bookmark text-neonGreen"></i> บันทึกผล
                    </button>
                    <button class="flex-1 sm:flex-none bg-neonGreen hover:bg-neonGreenHover text-white px-4 py-2 rounded-lg text-sm transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-print"></i> พิมพ์รายงาน
                    </button>
                </div>
            </div>

            <!-- BMI Main Display Card -->
            <div class="bg-darkBg border border-panelBorder rounded-xl p-6 flex flex-col md:flex-row items-center gap-8">
                <!-- BMI Number -->
                <div class="flex flex-col items-center justify-center min-w-[150px]">
                    <span class="text-sm text-slate-400 mb-1">ดัชนีมวลกาย (BMI)</span>
                    <span id="displayBmi" class="text-6xl font-bold text-white mb-2">22.5</span>
                    <span id="displayBmiStatus" class="bg-green-900/50 text-green-400 border border-green-500/30 px-3 py-1 rounded-full text-xs font-semibold">ปกติ (สมส่วน)</span>
                </div>

                <!-- BMI Segmented Bar -->
                <div class="flex-1 w-full flex flex-col gap-2">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>ระดับ BMI (เกณฑ์เอเชีย)</span>
                        <span>ช่วงปกติ: 18.5 - 22.9</span>
                    </div>
                    
                    <div class="relative w-full h-4 rounded-full overflow-hidden flex bg-panelBg border border-slate-700">
                        <!-- Segments -->
                        <div class="bmi-segment bg-blue-500" style="width: 20%" title="ผอม (<18.5)"></div>
                        <div class="bmi-segment bg-green-500" style="width: 20%" title="ปกติ (18.5 - 22.9)"></div>
                        <div class="bmi-segment bg-yellow-400" style="width: 20%" title="ท้วม (23.0 - 24.9)"></div>
                        <div class="bmi-segment bg-orange-500" style="width: 20%" title="อ้วน (25.0 - 29.9)"></div>
                        <div class="bmi-segment bg-red-600" style="width: 20%" title="อ้วนมาก (≥30)"></div>
                        
                        <!-- Indicator Line -->
                        <div id="bmiIndicator" class="indicator-line absolute top-0 h-full w-1.5 bg-white shadow-[0_0_5px_rgba(0,0,0,0.8)] border border-slate-900 rounded-full" style="left: 30%; transform: translateX(-50%);"></div>
                    </div>
                    
                    <!-- Labels -->
                    <div class="flex justify-between text-[10px] text-slate-500 font-medium px-2 mt-1">
                        <span class="w-[20%] text-center text-blue-400">ผอม</span>
                        <span class="w-[20%] text-center text-green-400">ปกติ</span>
                        <span class="w-[20%] text-center text-yellow-400">ท้วม</span>
                        <span class="w-[20%] text-center text-orange-400">อ้วน</span>
                        <span class="w-[20%] text-center text-red-500">อ้วนมาก</span>
                    </div>
                </div>
            </div>

            <!-- 4 Bottom Metric Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-2">
                
                <!-- BMR -->
                <div class="bg-darkBg border border-panelBorder rounded-xl p-4 flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-400">BMR (พักผ่อน)</span>
                        <i class="fa-solid fa-bed text-indigo-400"></i>
                    </div>
                    <div class="flex items-end gap-1">
                        <span id="displayBmr" class="text-2xl font-bold text-white">1,593</span>
                        <span class="text-[10px] text-slate-500 mb-1">kcal</span>
                    </div>
                </div>

                <!-- TDEE -->
                <div class="bg-darkBg border border-panelBorder rounded-xl p-4 flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-400">TDEE (ใช้จริง)</span>
                        <i class="fa-solid fa-fire text-orange-500"></i>
                    </div>
                    <div class="flex items-end gap-1">
                        <span id="displayTdee" class="text-2xl font-bold text-white">1,912</span>
                        <span class="text-[10px] text-slate-500 mb-1">kcal</span>
                    </div>
                </div>

                <!-- Body Fat -->
                <div class="bg-darkBg border border-panelBorder rounded-xl p-4 flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-400">เปอร์เซ็นต์ไขมัน</span>
                        <i class="fa-solid fa-droplet text-yellow-400"></i>
                    </div>
                    <div class="flex items-end gap-1">
                        <span id="displayFat" class="text-2xl font-bold text-white">16.5</span>
                        <span class="text-[10px] text-slate-500 mb-1">%</span>
                    </div>
                </div>

                <!-- Waist Ratio -->
                <div class="bg-darkBg border border-panelBorder rounded-xl p-4 flex flex-col justify-center">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs text-slate-400">อัตราส่วนรอบเอว</span>
                        <i class="fa-solid fa-ruler-horizontal text-neonGreen"></i>
                    </div>
                    <div class="flex items-end gap-1">
                        <span id="displayWaistRatio" class="text-2xl font-bold text-white">0.44</span>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script>
        let currentGender = 'male';

        function setGender(gender) {
            currentGender = gender;
            const btnMale = document.getElementById('btnMale');
            const btnFemale = document.getElementById('btnFemale');

            if (gender === 'male') {
                btnMale.className = "gender-btn active flex items-center justify-center gap-2 py-3 rounded-lg border-2 transition-all";
                btnFemale.className = "gender-btn inactive flex items-center justify-center gap-2 py-3 rounded-lg border-2 transition-all";
            } else {
                btnMale.className = "gender-btn inactive flex items-center justify-center gap-2 py-3 rounded-lg border-2 transition-all";
                btnFemale.className = "gender-btn active flex items-center justify-center gap-2 py-3 rounded-lg border-2 transition-all";
            }
            updateCalculations();
        }

        function updateCalculations() {
            // Get values from sliders
            const age = parseFloat(document.getElementById('inputAge').value);
            const height = parseFloat(document.getElementById('inputHeight').value);
            const weight = parseFloat(document.getElementById('inputWeight').value);
            const waist = parseFloat(document.getElementById('inputWaist').value);

            // Update Text Displays next to sliders
            document.getElementById('valAge').innerText = age;
            document.getElementById('valHeight').innerText = height;
            document.getElementById('valWeight').innerText = weight;
            document.getElementById('valWaist').innerText = waist;

            // 1. BMI Calculation
            const heightM = height / 100;
            const bmi = weight / (heightM * heightM);
            document.getElementById('displayBmi').innerText = bmi.toFixed(1);

            // BMI Status & Indicator Positioning (Asian Criteria)
            let statusText = "";
            let statusClasses = "";
            let indicatorPosition = 0; // percentage 0-100

            if (bmi < 18.5) {
                statusText = "ผอม";
                statusClasses = "bg-blue-900/50 text-blue-400 border border-blue-500/30 px-3 py-1 rounded-full text-xs font-semibold";
                // Map <18.5 to 0-20% segment (let's say 15 to 18.5 maps to 0 to 20%)
                indicatorPosition = Math.max(0, ((bmi - 15) / (18.5 - 15)) * 20);
            } else if (bmi >= 18.5 && bmi <= 22.9) {
                statusText = "ปกติ (สมส่วน)";
                statusClasses = "bg-green-900/50 text-green-400 border border-green-500/30 px-3 py-1 rounded-full text-xs font-semibold";
                // Map 18.5-22.9 to 20-40% segment
                indicatorPosition = 20 + (((bmi - 18.5) / (22.9 - 18.5)) * 20);
            } else if (bmi >= 23.0 && bmi <= 24.9) {
                statusText = "ท้วม";
                statusClasses = "bg-yellow-900/50 text-yellow-400 border border-yellow-500/30 px-3 py-1 rounded-full text-xs font-semibold";
                // Map 23-24.9 to 40-60% segment
                indicatorPosition = 40 + (((bmi - 23.0) / (24.9 - 23.0)) * 20);
            } else if (bmi >= 25.0 && bmi <= 29.9) {
                statusText = "อ้วน";
                statusClasses = "bg-orange-900/50 text-orange-400 border border-orange-500/30 px-3 py-1 rounded-full text-xs font-semibold";
                // Map 25-29.9 to 60-80% segment
                indicatorPosition = 60 + (((bmi - 25.0) / (29.9 - 25.0)) * 20);
            } else {
                statusText = "อ้วนมาก";
                statusClasses = "bg-red-900/50 text-red-400 border border-red-500/30 px-3 py-1 rounded-full text-xs font-semibold";
                // Map >30 to 80-100% segment (cap at 40 BMI for 100%)
                indicatorPosition = Math.min(100, 80 + (((bmi - 30.0) / (40.0 - 30.0)) * 20));
            }

            document.getElementById('displayBmiStatus').innerText = statusText;
            document.getElementById('displayBmiStatus').className = statusClasses;
            document.getElementById('bmiIndicator').style.left = `${indicatorPosition}%`;

            // 2. BMR (Mifflin-St Jeor)
            let bmr = 0;
            if (currentGender === 'male') {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) + 5;
            } else {
                bmr = (10 * weight) + (6.25 * height) - (5 * age) - 161;
            }
            document.getElementById('displayBmr').innerText = Math.round(bmr).toLocaleString();

            // 3. TDEE (Assume sedentary/lightly active 1.2 multiplier for baseline calculation)
            let tdee = bmr * 1.2;
            document.getElementById('displayTdee').innerText = Math.round(tdee).toLocaleString();

            // 4. Body Fat % (Deurenberg Formula)
            let genderFactor = currentGender === 'male' ? 1 : 0;
            let bodyFat = (1.20 * bmi) + (0.23 * age) - (10.8 * genderFactor) - 5.4;
            // Cap reasonable values
            bodyFat = Math.max(3, Math.min(60, bodyFat));
            document.getElementById('displayFat').innerText = bodyFat.toFixed(1);

            // 5. Waist to Height Ratio
            let waistRatio = waist / height;
            document.getElementById('displayWaistRatio').innerText = waistRatio.toFixed(2);
        }

        // Initialize on load
        window.onload = updateCalculations;
    </script>
</body>
</html>
